<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Engineering progress signal board">
  <rect width="1200" height="675" fill="#f4efe4"/>
  <rect x="80" y="80" width="1040" height="515" rx="16" fill="#fff" stroke="#d8cdbd" stroke-width="3"/>
  <text x="120" y="150" font-family="Inter, Arial, sans-serif" font-size="40" fill="#2b231a">Engineering Progress Signals</text>
  <text x="120" y="198" font-family="Inter, Arial, sans-serif" font-size="22" fill="#6f6456">Track outcomes, not activity</text>

  <rect x="130" y="245" width="290" height="280" rx="12" fill="#f8f3ea" stroke="#d8cdbd"/>
  <text x="160" y="290" font-family="Inter, Arial, sans-serif" font-size="26" fill="#2b231a">Delivery</text>
  <text x="160" y="330" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2b231a">Lead time</text>
  <text x="160" y="360" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2b231a">Deploy frequency</text>

  <rect x="455" y="245" width="290" height="280" rx="12" fill="#f8f3ea" stroke="#d8cdbd"/>
  <text x="485" y="290" font-family="Inter, Arial, sans-serif" font-size="26" fill="#2b231a">Reliability</text>
  <text x="485" y="330" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2b231a">Change failure rate</text>
  <text x="485" y="360" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2b231a">MTTR</text>

  <rect x="780" y="245" width="290" height="280" rx="12" fill="#f8f3ea" stroke="#d8cdbd"/>
  <text x="810" y="290" font-family="Inter, Arial, sans-serif" font-size="26" fill="#2b231a">Product Impact</text>
  <text x="810" y="330" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2b231a">Adoption</text>
  <text x="810" y="360" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2b231a">Task success</text>
</svg>
