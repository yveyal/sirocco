<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Platform groups landscape">
  <rect width="1200" height="675" fill="#f4efe4"/>
  <rect x="70" y="90" width="1060" height="500" rx="18" fill="#fff" stroke="#d8cdbd" stroke-width="3"/>
  <text x="100" y="150" font-family="Inter, Arial, sans-serif" font-size="42" fill="#2b231a">AI Platform Groups</text>
  <text x="100" y="200" font-family="Inter, Arial, sans-serif" font-size="24" fill="#6f6456">Shared goals across model, data, and developer-experience tracks</text>

  <rect x="110" y="250" width="300" height="260" rx="14" fill="#f8f3ea" stroke="#d8cdbd"/>
  <text x="140" y="295" font-family="Inter, Arial, sans-serif" font-size="28" fill="#2b231a">Model Ops</text>
  <text x="140" y="335" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2b231a">Reliability</text>
  <text x="140" y="365" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2b231a">Latency</text>
  <text x="140" y="395" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2b231a">Cost per request</text>

  <rect x="450" y="250" width="300" height="260" rx="14" fill="#f8f3ea" stroke="#d8cdbd"/>
  <text x="480" y="295" font-family="Inter, Arial, sans-serif" font-size="28" fill="#2b231a">Data Platform</text>
  <text x="480" y="335" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2b231a">Freshness</text>
  <text x="480" y="365" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2b231a">Coverage</text>
  <text x="480" y="395" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2b231a">Quality signals</text>

  <rect x="790" y="250" width="300" height="260" rx="14" fill="#f8f3ea" stroke="#d8cdbd"/>
  <text x="820" y="295" font-family="Inter, Arial, sans-serif" font-size="28" fill="#2b231a">DevEx</text>
  <text x="820" y="335" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2b231a">Golden paths</text>
  <text x="820" y="365" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2b231a">Time to first deploy</text>
  <text x="820" y="395" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2b231a">Incident learning</text>
