<!doctype html>
<html lang="{{ or site.Language.Lang site.LanguageCode "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with site.Params.description }}{{ . }}{{ else }}{{ site.Title }}{{ end }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ "css/theme.css" | relURL }}">
</head>
<body class="site-shell">
  {{ partial "header.html" . }}
  <main class="pb-5 flex-grow-1">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script type="module">
    const mermaidCodeBlocks = document.querySelectorAll("pre code.language-mermaid");
    if (mermaidCodeBlocks.length > 0) {
      const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs");
      mermaid.initialize({ startOnLoad: false, theme: "neutral" });

      mermaidCodeBlocks.forEach((code) => {
        const pre = code.closest("pre");
        if (!pre) return;
        const container = document.createElement("div");
        container.className = "mermaid mermaid-container";
        container.textContent = code.textContent || "";
        pre.replaceWith(container);
      });

      await mermaid.run({
        nodes: document.querySelectorAll(".mermaid")
      });
    }
  </script>
</body>
</html>
